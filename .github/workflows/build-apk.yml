name: Build CleanTV APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch upstream sources
        run: git clone --depth 1 https://github.com/zhbcher/CleanTV-With-ChildLock.git src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "platform-tools"

      - name: Toolchain info
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build debug and release APKs
        run: |
          cd src
          set +e
          if [ -x ./gradlew ]; then CMD="./gradlew"; else CMD="gradle"; fi
          $CMD assembleDebug assembleRelease --no-daemon --stacktrace > "$GITHUB_WORKSPACE/build.log" 2>&1
          code=$?
          cat "$GITHUB_WORKSPACE/build.log"
          echo "BUILD_EXIT_CODE=$code" >> "$GITHUB_WORKSPACE/build.log"
          exit $code

      - name: Collect APKs
        run: |
          mkdir -p out
          find src/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out
          sha256sum out/*.apk | tee "$GITHUB_WORKSPACE/checksums.txt"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CleanTV-APK
          path: |
            out/*.apk
            build.log
            checksums.txt
          if-no-files-found: warn

      - name: Publish APKs to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: CleanTV APK build ${{ github.run_number }}
          body: |
            Auto-built from zhbcher/CleanTV-With-ChildLock at ${{ github.sha }}
            app-release.apk: release variant (signed with debug key)
            app-debug.apk: debug variant (debuggable)
          files: out/*.apk
          fail_on_unmatched_files: false
